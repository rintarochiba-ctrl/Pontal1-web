server.port=8080

# 手元で mvn spring-boot:run をするとき、プロジェクト直下の .env(KEY=VALUE の形式)を読む
# (Dockerでは、環境変数として渡されるので、このファイルが無くても動く)
spring.config.import=optional:file:.env[.properties]

# Controllerが返す画面の名前から、JSPのファイルの場所を決める
# 例: return "login"; → /WEB-INF/jsp/login.jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# PontalのAPIの接続先(環境変数 PONTAL_API_BASE_URL があればそちらを使う)
# 既定は、Dockerで動かしたPontalのAPI(docker-compose.ymlの8092)
pontal.api.base-url=${PONTAL_API_BASE_URL:http://localhost:8092}

# Cognito(ログイン画面で使う)。値は、.env(環境変数)から読む
cognito.region=${COGNITO_REGION:ap-southeast-2}
cognito.client-id=${COGNITO_CLIENT_ID:}

# ログインの有効期間。Cognitoのアクセストークンの期限(1時間)に合わせる
server.servlet.session.timeout=60m
# セッションのCookieは、JavaScriptから読めず、他のサイトからの送信には付かないようにする
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
